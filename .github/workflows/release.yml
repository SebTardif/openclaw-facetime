name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer to release, with or without a leading v"
        required: true
        type: string

permissions: {}

concurrency:
  group: facetime-release
  cancel-in-progress: false

jobs:
  validate:
    name: 1 · Validate frozen source
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      tag: ${{ steps.input.outputs.tag }}
      target-sha: ${{ steps.source.outputs.target-sha }}
      tag-object-sha: ${{ steps.source.outputs.tag-object-sha }}
    steps:
      - name: Validate input
        id: input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version=${VERSION#v}
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
          echo "tag=v$version" >>"$GITHUB_OUTPUT"
      - name: Resolve protected release target
        id: source
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TAG: ${{ steps.input.outputs.tag }}
        with:
          script: |
            const repository = await github.rest.repos.get(context.repo);
            const branchName = repository.data.default_branch;
            const branch = await github.rest.repos.getBranch({ ...context.repo, branch: branchName });
            if (context.ref !== `refs/heads/${branchName}` || context.sha !== branch.data.commit.sha) {
              throw new Error(`release must run from current ${branchName}`);
            }
            let targetSha = context.sha;
            let tagObjectSha = '';
            try {
              const ref = await github.rest.git.getRef({ ...context.repo, ref: `tags/${process.env.TAG}` });
              if (ref.data.object.type !== 'tag') throw new Error('existing release tag must be annotated');
              tagObjectSha = ref.data.object.sha;
              const tag = await github.rest.git.getTag({ ...context.repo, tag_sha: tagObjectSha });
              if (tag.data.object.type !== 'commit') throw new Error('release tag must peel to a commit');
              targetSha = tag.data.object.sha;
              const comparison = await github.rest.repos.compareCommitsWithBasehead({
                ...context.repo, basehead: `${targetSha}...${context.sha}`,
              });
              if (!['ahead', 'identical'].includes(comparison.data.status)) {
                throw new Error('existing release tag is not reachable from the default branch');
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            core.setOutput('target-sha', targetSha);
            core.setOutput('tag-object-sha', tagObjectSha);
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.source.outputs.target-sha }}
      - name: Verify version and exact CI
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TAG: ${{ steps.input.outputs.tag }}
          TARGET_SHA: ${{ steps.source.outputs.target-sha }}
        with:
          script: |
            const fs = require('fs');
            const version = fs.readFileSync('version.env', 'utf8').match(/^VERSION=(.+)$/m)?.[1];
            if (`v${version}` !== process.env.TAG) throw new Error('version.env does not match release input');
            const repository = await github.rest.repos.get(context.repo);
            const branchName = repository.data.default_branch;
            const workflow = await github.rest.actions.getWorkflow({
              ...context.repo, workflow_id: 'ci.yml',
            });
            if (workflow.data.state !== 'active') throw new Error('CI workflow is not active');
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...context.repo,
              workflow_id: workflow.data.id,
              branch: branchName,
              event: 'push',
              head_sha: process.env.TARGET_SHA,
              status: 'completed',
              per_page: 100,
            });
            const green = runs.find((run) =>
              run.head_sha === process.env.TARGET_SHA &&
              run.head_branch === branchName &&
              run.event === 'push' &&
              run.status === 'completed' &&
              run.conclusion === 'success'
            );
            if (!green) throw new Error(`no successful ${branchName} push run of ci.yml for ${process.env.TARGET_SHA}`);
      - name: Validate release prerequisites
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          set -euo pipefail
          for name in MACOS_SIGNING_P12 MACOS_SIGNING_P12_PASSWORD ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY_P8 HOMEBREW_TAP_TOKEN; do
            [[ -n "${!name:-}" ]] || { echo "missing release secret: $name" >&2; exit 1; }
          done
          [[ "$REPOSITORY_VISIBILITY" == "public" ]] || {
            echo "openclaw/openclaw-facetime must be public before its GitHub release can back Homebrew" >&2
            exit 1
          }

  tag:
    name: 2 · Freeze annotated tag
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag-object-sha: ${{ steps.freeze.outputs.tag-object-sha }}
    steps:
      - name: Create or verify tag
        id: freeze
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EXPECTED_TAG_OBJECT: ${{ needs.validate.outputs.tag-object-sha }}
          TAG: ${{ needs.validate.outputs.tag }}
          TARGET_SHA: ${{ needs.validate.outputs.target-sha }}
        with:
          script: |
            if (process.env.EXPECTED_TAG_OBJECT) {
              const ref = await github.rest.git.getRef({ ...context.repo, ref: `tags/${process.env.TAG}` });
              if (ref.data.object.type !== 'tag' || ref.data.object.sha !== process.env.EXPECTED_TAG_OBJECT) {
                throw new Error('release tag changed after validation');
              }
              core.setOutput('tag-object-sha', ref.data.object.sha);
              return;
            }
            const tag = await github.rest.git.createTag({
              ...context.repo,
              tag: process.env.TAG,
              message: `Release ${process.env.TAG}`,
              object: process.env.TARGET_SHA,
              type: 'commit',
              tagger: {
                name: 'github-actions[bot]',
                email: '41898282+github-actions[bot]@users.noreply.github.com',
                date: new Date().toISOString(),
              },
            });
            await github.rest.git.createRef({ ...context.repo, ref: `refs/tags/${process.env.TAG}`, sha: tag.data.sha });
            core.setOutput('tag-object-sha', tag.data.sha);

  sign:
    name: 3 · Build, sign, and notarize
    needs: [validate, tag]
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      artifact-name: ${{ steps.output.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.target-sha }}
      - name: Import OpenClaw Foundation signer
        id: signer
        env:
          P12_BASE64: ${{ secrets.MACOS_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          team=FWJYW4S8P8
          authority="Developer ID Application: OpenClaw Foundation ($team)"
          keychain="$RUNNER_TEMP/facetime-release.keychain-db"
          search_list="$RUNNER_TEMP/facetime-original-keychains.txt"
          password=$(openssl rand -hex 32)
          p12="$RUNNER_TEMP/facetime-release.p12"
          {
            echo "keychain=$keychain"
            echo "p12=$p12"
            echo "search-list=$search_list"
          } >>"$GITHUB_OUTPUT"
          security list-keychains -d user | \
            sed -E 's/^[[:space:]]*"//; s/"[[:space:]]*$//' >"$search_list"
          printf '%s' "$P12_BASE64" | base64 --decode >"$p12"
          security create-keychain -p "$password" "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security import "$p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          original_keychains=()
          while IFS= read -r existing_keychain; do
            [[ -z "$existing_keychain" ]] || original_keychains+=("$existing_keychain")
          done <"$search_list"
          security list-keychains -d user -s "$keychain" "${original_keychains[@]}"
          identity=$(security find-identity -v -p codesigning "$keychain" | awk -v authority="$authority" 'index($0, "\"" authority "\"") && $2 ~ /^[0-9A-Fa-f]{40}$/ { print $2; exit }')
          [[ "$identity" =~ ^[0-9A-Fa-f]{40}$ ]] || { echo "required signing identity missing: $authority" >&2; exit 1; }
          echo "identity=$identity" >>"$GITHUB_OUTPUT"
          : >"$p12"
          /usr/bin/trash "$p12"
      - name: Create signed release payload
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          CODESIGN_IDENTITY: ${{ steps.signer.outputs.identity }}
          EXPECTED_TEAM_ID: FWJYW4S8P8
          OUTPUT_DIR: ${{ github.workspace }}/bin
        run: |
          scripts/sign-and-notarize.sh
          REQUIRE_DEVELOPER_ID=1 REQUIRE_NOTARIZATION_RECEIPT=1 REQUIRE_NOTARIZED_GATEKEEPER=1 \
            EXPECTED_TEAM_ID=FWJYW4S8P8 make native-verify
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: bin/openclaw-facetime-macos-arm64.zip*
          if-no-files-found: error
          retention-days: 30
      - id: output
        run: echo "artifact-name=native-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >>"$GITHUB_OUTPUT"
      - name: Restore keychain search list and delete signing material
        if: always()
        env:
          KEYCHAIN: ${{ steps.signer.outputs.keychain }}
          P12: ${{ steps.signer.outputs.p12 }}
          SEARCH_LIST: ${{ steps.signer.outputs.search-list }}
        run: |
          set -euo pipefail
          cleanup_status=0
          if [[ -n "${P12:-}" && -e "$P12" ]]; then
            : >"$P12"
            /usr/bin/trash "$P12" || cleanup_status=$?
          fi
          if [[ -n "${SEARCH_LIST:-}" && -f "$SEARCH_LIST" ]]; then
            original_keychains=()
            while IFS= read -r existing_keychain; do
              [[ -z "$existing_keychain" ]] || original_keychains+=("$existing_keychain")
            done <"$SEARCH_LIST"
            security list-keychains -d user -s "${original_keychains[@]}" || cleanup_status=$?
            /usr/bin/trash "$SEARCH_LIST" || cleanup_status=$?
          fi
          if [[ -n "${KEYCHAIN:-}" && -e "$KEYCHAIN" ]]; then
            security delete-keychain "$KEYCHAIN" || cleanup_status=$?
          fi
          exit "$cleanup_status"

  release:
    name: 4 · Draft, verify, and publish
    needs: [validate, tag, sign]
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.target-sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.sign.outputs.artifact-name }}
          path: release-assets
      - name: Verify frozen tag before release writes
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env: &release-tag-environment
          TAG: ${{ needs.validate.outputs.tag }}
          TARGET_SHA: ${{ needs.validate.outputs.target-sha }}
          TAG_OBJECT_SHA: ${{ needs.tag.outputs.tag-object-sha }}
        # Keep the guard in the workflow so reruns of older release targets do
        # not depend on a newly added script in the target checkout.
        with: &verify-release-tag
          script: |
            const ref = await github.rest.git.getRef({ ...context.repo, ref: `tags/${process.env.TAG}` });
            if (ref.data.object.type !== 'tag' || ref.data.object.sha !== process.env.TAG_OBJECT_SHA) {
              throw new Error('release tag changed after it was frozen');
            }
            const tag = await github.rest.git.getTag({ ...context.repo, tag_sha: ref.data.object.sha });
            if (tag.data.object.type !== 'commit' || tag.data.object.sha !== process.env.TARGET_SHA) {
              throw new Error('release tag no longer identifies the validated source');
            }
      - name: Create or resume release
        id: release-state
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json isDraft >/dev/null 2>&1; then
            is_draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
            if [[ "$is_draft" == "true" ]]; then
              gh release upload "$TAG" release-assets/* --clobber
              echo "publish-needed=true" >>"$GITHUB_OUTPUT"
            elif [[ "$is_draft" == "false" ]]; then
              echo "publish-needed=false" >>"$GITHUB_OUTPUT"
            else
              echo "Could not determine existing release state for $TAG" >&2
              exit 1
            fi
          else
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --generate-notes
            gh release upload "$TAG" release-assets/* --clobber
            echo "publish-needed=true" >>"$GITHUB_OUTPUT"
          fi
      - name: Download and independently verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          mkdir -p bin
          gh release download "$TAG" --dir bin --pattern 'openclaw-facetime-macos-arm64.zip*'
          REQUIRE_DEVELOPER_ID=1 REQUIRE_NOTARIZATION_RECEIPT=1 REQUIRE_NOTARIZED_GATEKEEPER=1 \
            EXPECTED_TEAM_ID=FWJYW4S8P8 make native-verify
      - name: Verify frozen tag before publication and handoff
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env: *release-tag-environment
        with: *verify-release-tag
      - name: Publish verified draft
        if: steps.release-state.outputs.publish-needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: gh release edit "$TAG" --draft=false

  homebrew:
    name: 5 · Update Homebrew
    needs: [validate, release]
    permissions:
      contents: read
    uses: ./.github/workflows/homebrew-handoff.yml
    with:
      native-source-sha: ${{ needs.validate.outputs.target-sha }}
      tag: ${{ needs.validate.outputs.tag }}
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
