name: Release

on:
  push:
    tags: ['v*', 'release-recovery/**']
  workflow_dispatch:
    inputs:
      version:
        description: Prepared version (blank uses the current metadata)
        type: string
        required: false
      dry_run:
        description: Build, sign, notarize and verify without publishing
        type: boolean
        default: true

permissions: {}

concurrency:
  group: facetime-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      target-sha: ${{ steps.source.outputs.sha }}
      tag-object-sha: ${{ steps.source.outputs.tag_object }}
      recovery-tag: ${{ steps.source.outputs.recovery_tag }}
      recovery-tag-object-sha: ${{ steps.source.outputs.recovery_tag_object }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate source and exact push CI
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          VERSION: ${{ inputs.version || github.ref_name }}
          CI_WORKFLOWS: ci.yml
        run: |
          if [ "$VERSION" = main ]; then VERSION="$(sed -n 's/^VERSION=//p' version.env)"; export VERSION; fi
          python3 -B scripts/release-preflight.py

  sign:
    name: 3 · Build, sign, and notarize
    needs: validate
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      artifact-name: ${{ steps.output.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.target-sha }}
      - name: Import OpenClaw Foundation signer
        id: signer
        env:
          P12_BASE64: ${{ secrets.MACOS_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          team=FWJYW4S8P8
          authority="Developer ID Application: OpenClaw Foundation ($team)"
          keychain="$RUNNER_TEMP/facetime-release.keychain-db"
          search_list="$RUNNER_TEMP/facetime-original-keychains.txt"
          password=$(openssl rand -hex 32)
          p12="$RUNNER_TEMP/facetime-release.p12"
          {
            echo "keychain=$keychain"
            echo "p12=$p12"
            echo "search-list=$search_list"
          } >>"$GITHUB_OUTPUT"
          security list-keychains -d user | \
            sed -E 's/^[[:space:]]*"//; s/"[[:space:]]*$//' >"$search_list"
          printf '%s' "$P12_BASE64" | base64 --decode >"$p12"
          security create-keychain -p "$password" "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security import "$p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          original_keychains=()
          while IFS= read -r existing_keychain; do
            [[ -z "$existing_keychain" ]] || original_keychains+=("$existing_keychain")
          done <"$search_list"
          security list-keychains -d user -s "$keychain" "${original_keychains[@]}"
          identity=$(security find-identity -v -p codesigning "$keychain" | awk -v authority="$authority" 'index($0, "\"" authority "\"") && $2 ~ /^[0-9A-Fa-f]{40}$/ { print $2; exit }')
          [[ "$identity" =~ ^[0-9A-Fa-f]{40}$ ]] || { echo "required signing identity missing: $authority" >&2; exit 1; }
          echo "identity=$identity" >>"$GITHUB_OUTPUT"
          : >"$p12"
          rm -f "$p12"
      - name: Create signed release payload
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          CODESIGN_IDENTITY: ${{ steps.signer.outputs.identity }}
          EXPECTED_TEAM_ID: FWJYW4S8P8
          OUTPUT_DIR: ${{ github.workspace }}/bin
        run: |
          scripts/sign-and-notarize.sh
          REQUIRE_DEVELOPER_ID=1 REQUIRE_NOTARIZATION_RECEIPT=1 REQUIRE_NOTARIZED_GATEKEEPER=1 \
            EXPECTED_TEAM_ID=FWJYW4S8P8 make native-verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: bin/openclaw-facetime-macos-arm64.zip*
          if-no-files-found: error
          retention-days: 30
      - id: output
        run: echo "artifact-name=native-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >>"$GITHUB_OUTPUT"
      - name: Restore keychain search list and delete signing material
        if: always()
        env:
          KEYCHAIN: ${{ steps.signer.outputs.keychain }}
          P12: ${{ steps.signer.outputs.p12 }}
          SEARCH_LIST: ${{ steps.signer.outputs.search-list }}
        run: |
          set -euo pipefail
          cleanup_status=0
          if [[ -n "${P12:-}" && -e "$P12" ]]; then
            : >"$P12"
            rm -f "$P12" || cleanup_status=$?
          fi
          if [[ -n "${SEARCH_LIST:-}" && -f "$SEARCH_LIST" ]]; then
            original_keychains=()
            while IFS= read -r existing_keychain; do
              [[ -z "$existing_keychain" ]] || original_keychains+=("$existing_keychain")
            done <"$SEARCH_LIST"
            security list-keychains -d user -s "${original_keychains[@]}" || cleanup_status=$?
            rm -f "$SEARCH_LIST" || cleanup_status=$?
          fi
          if [[ -n "${KEYCHAIN:-}" && -e "$KEYCHAIN" ]]; then
            security delete-keychain "$KEYCHAIN" || cleanup_status=$?
          fi
          exit "$cleanup_status"

  verify:
    needs: [validate, sign]
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.target-sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.sign.outputs.artifact-name }}
          path: bin
      - name: Independently verify signed payload
        run: |
          REQUIRE_DEVELOPER_ID=1 REQUIRE_NOTARIZATION_RECEIPT=1 REQUIRE_NOTARIZED_GATEKEEPER=1 \
            EXPECTED_TEAM_ID=FWJYW4S8P8 make native-verify

  release:
    if: github.event_name == 'push'
    needs: [validate, sign, verify]
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.target-sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.sign.outputs.artifact-name }}
          path: release-assets
      - name: Reverify tag and publish exact changelog notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          TAG_OBJECT: ${{ needs.validate.outputs.tag-object-sha }}
          RECOVERY_TAG: ${{ needs.validate.outputs.recovery-tag }}
          RECOVERY_TAG_OBJECT: ${{ needs.validate.outputs.recovery-tag-object-sha }}
        run: |
          set -euo pipefail
          if [[ -n "$RECOVERY_TAG" ]]; then
            git fetch origin "refs/tags/$RECOVERY_TAG:refs/audit/recovery"
            test "$(git rev-parse refs/audit/recovery)" = "$RECOVERY_TAG_OBJECT"
            git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile=.github/release-allowed-signers verify-tag refs/audit/recovery
          fi
          git fetch origin "refs/tags/$TAG:refs/audit/tag"
          test "$(git rev-parse refs/audit/tag)" = "$TAG_OBJECT"
          git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile=.github/release-allowed-signers verify-tag refs/audit/tag
          python3 - "$TAG" <<'PYCODE'
          import importlib.util
          from pathlib import Path
          import sys
          spec = importlib.util.spec_from_file_location('release', 'scripts/release-preflight.py')
          release = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(release)
          Path('release-notes.md').write_text(release.notes_for(Path('CHANGELOG.md').read_text(), sys.argv[1][1:]))
          PYCODE
          release_args=("$TAG" release-assets/* --draft --verify-tag --title "$TAG" --notes-file release-notes.md)
          [[ "$TAG" != *-* ]] || release_args+=(--prerelease --latest=false)
          gh release create "${release_args[@]}"
          gh release download "$TAG" --dir bin --pattern 'openclaw-facetime-macos-arm64.zip*'
          cmp release-assets/openclaw-facetime-macos-arm64.zip bin/openclaw-facetime-macos-arm64.zip
          REQUIRE_DEVELOPER_ID=1 REQUIRE_NOTARIZATION_RECEIPT=1 REQUIRE_NOTARIZED_GATEKEEPER=1 \
            EXPECTED_TEAM_ID=FWJYW4S8P8 make native-verify
          gh release edit "$TAG" --draft=false

  homebrew:
    if: github.event_name == 'push' && !contains(needs.validate.outputs.tag, '-')
    name: 5 · Update Homebrew
    needs: [validate, release]
    permissions:
      contents: read
    uses: ./.github/workflows/homebrew-handoff.yml
    with:
      native-source-sha: ${{ needs.validate.outputs.target-sha }}
      tag: ${{ needs.validate.outputs.tag }}
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
